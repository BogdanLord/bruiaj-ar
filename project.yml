name: BruiajAR
options:
  bundleIdPrefix: ro.uoradea.virtual
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"   # 1 = iPhone
    # Sideloadly se ocupă de semnare; build-ul din CI e nesemnat.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  BruiajAR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bruiaj AR
        CFBundleName: BruiajAR
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Camera este folosită pentru vizualizarea AR a zonelor de bruiaj GNSS."
        NSLocationWhenInUseUsageDescription: "Locația este folosită pentru a plasa zonele de bruiaj în AR față de poziția ta și pe radar."
